<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캐릭터 타임라인 메이커</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#f4f3f1; --panel:#ffffff; --ink:#1d1d20; --muted:#8a8880;
  --line:#e6e4df; --btn:#1d1d20; --btn-ink:#ffffff; --radius:10px;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
}
.app{display:flex; gap:16px; padding:16px; max-width:1500px; margin:0 auto; align-items:flex-start;}
@media (max-width:900px){
  .app{flex-direction:column;}
  .editor{width:100% !important; position:static !important; max-height:none !important;}
  #jumpBtn{display:block;}
  input[type=text], input[type=number], textarea, select{font-size:16px;}
}
#jumpBtn{display:none; position:fixed; right:16px; bottom:16px; z-index:50; border-radius:999px; padding:12px 18px; box-shadow:0 6px 18px rgba(0,0,0,.28);}
.app #tl .item .evcard, .app #tl .divider{cursor:pointer;}
.app #tl .item:hover .evcard{box-shadow:inset 0 0 0 1.5px rgba(128,128,128,.5);}

/* ───────── 편집 패널 ───────── */
.editor{width:390px; flex-shrink:0; position:sticky; top:16px; display:flex; flex-direction:column; gap:12px; max-height:calc(100vh - 32px); overflow-y:auto;}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px;}
.card h2{font-size:12px; font-weight:700; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; margin-bottom:10px;}
.row{display:flex; gap:7px; align-items:center; margin-bottom:8px;}
.row:last-child{margin-bottom:0;}
label.small{font-size:12px; color:var(--muted); flex-shrink:0; width:52px;}
input[type=text], input[type=number], textarea, select{
  width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px;
  font:inherit; background:#fbfaf9; color:var(--ink); outline:none;
}
input[type=text]:focus, textarea:focus{border-color:#b8b5ad;}
textarea{resize:vertical; min-height:56px;}
input[type=color]{width:36px; height:34px; padding:2px; border:1px solid var(--line); border-radius:8px; background:#fbfaf9; cursor:pointer; flex-shrink:0;}
input[type=range]{width:100%; accent-color:#1d1d20;}
button{font:inherit; cursor:pointer; border:none; border-radius:8px;}
.btn{background:var(--btn); color:var(--btn-ink); padding:9px 14px; font-weight:600;}
.btn:hover{opacity:.85;}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
.btn.ghost:hover{background:#f1efec;}
.btn.wide{width:100%;}
.seg{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; width:100%;}
.seg button{flex:1; padding:8px 0; background:#fbfaf9; color:var(--muted); font-weight:600; border-radius:0;}
.seg button.on{background:var(--btn); color:var(--btn-ink);}
.hint{font-size:11.5px; color:var(--muted); margin-top:6px;}
.chk{display:flex; align-items:center; gap:7px; font-size:12.5px; cursor:pointer;}
.thumb{width:34px; height:34px; border-radius:50%; object-fit:cover; border:1px solid var(--line); flex-shrink:0; background:#eceae6;}
.thumb.sq{border-radius:8px;}
.thumb.empty{opacity:.45;}
.mini{background:transparent; border:1px solid var(--line); color:var(--muted); padding:7px 8px; font-size:12px; flex-shrink:0; white-space:nowrap;}
.mini:hover{background:#f1efec; color:var(--ink);}
.mini.on{background:var(--btn); color:var(--btn-ink); border-color:var(--btn);}
.mini.grd{width:34px; height:34px; padding:0; display:flex; align-items:center; justify-content:center;}
.mini.grd span{width:16px; height:16px; border-radius:50%; display:block;}
.mini.grd:not(.on) span{filter:grayscale(1); opacity:.4;}
.mini.grd.on{background:#fff; border-color:var(--ink);}
.adjrows{border:1px solid var(--line); border-radius:8px; padding:9px 11px; margin-bottom:8px; background:#fbfaf9;}
.adjrows .row{margin-bottom:5px;}
.adjrows label{font-size:11px; color:var(--muted); width:34px; flex-shrink:0;}
#saveStatus{font-size:11px; color:var(--muted);}

/* 이벤트 목록 */
.evlist{display:flex; flex-direction:column; gap:6px; margin-top:10px;}
.ev{display:flex; align-items:center; gap:6px; padding:7px 8px; border:1px solid var(--line); border-radius:8px; background:#fbfaf9;}
.ev .grip{cursor:grab; color:#c9c6bf; font-size:14px; flex-shrink:0; user-select:none; padding:0 2px;}
.ev.dragging{opacity:.4;}
.ev .dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
.ev .dot.x{border-radius:2px; transform:rotate(45deg);}
.ev .dot.d{height:3px; border-radius:2px;}
.ev .txt{flex:1; min-width:0; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ev .txt b{font-weight:600;}
.ev .txt span{color:var(--muted);}
.ev .ops{display:flex; gap:2px; flex-shrink:0;}
.ev .ops button{background:transparent; color:var(--muted); width:24px; height:24px; font-size:13px; border-radius:6px;}
.ev .ops button:hover{background:#ecebe7; color:var(--ink);}
.ev.editing{border-color:var(--ink);}
details.adv{border-top:1px solid var(--line); margin-top:12px; padding-top:10px;}
details.adv summary{font-size:12px; color:var(--muted); cursor:pointer; font-weight:600;}
details.adv .inner{margin-top:10px;}

/* ───────── 미리보기 ───────── */
.stage{flex:1; min-width:0;}
.stagebar{display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap;}
.stagebar .sp{flex:1;}
.stagebar select{width:auto;}
.viewport{overflow:hidden; border:1px dashed #d7d4cd; border-radius:var(--radius); background:repeating-conic-gradient(#efede9 0% 25%, #f7f6f3 0% 50%) 50%/24px 24px;}
#scaler{transform-origin:top left;}

/* ───────── 타임라인 캔버스(내보내기 대상) ───────── */
.tlroot{padding:52px 44px 58px;}
.tlroot .banner{width:100%; border-radius:14px; margin-bottom:36px; position:relative; overflow:hidden;}
.tlroot .banner img{position:absolute; object-fit:cover;}
.tlroot .banner.fade{margin:-52px -44px 30px; width:calc(100% + 88px); border-radius:0;}
.tlroot .banner .bfade{position:absolute; left:0; top:0; right:0; bottom:-1px; z-index:1;}
.tlroot .banner.orig{overflow:visible;}
.tlroot .banner.orig.fade{overflow:hidden;}
.tlroot .banner.orig.fade img{border-radius:0;}
.tlroot .banner.orig img{position:static; width:100%; height:auto; display:block; border-radius:14px;}
.tlroot .fw{display:inline-block; position:relative; overflow:hidden; border-radius:50%; flex-shrink:0;}
.tlroot .fw img{position:absolute; object-fit:cover;}
.tlroot .tl-title{font-size:33px; font-weight:800; letter-spacing:-.02em; line-height:1.25; white-space:pre-wrap; text-align:center;}
.tlroot .synopsis{margin:26px auto 0; max-width:78%; font-size:13px; line-height:1.85; text-align:center; white-space:pre-wrap; padding-top:20px; position:relative;}
.tlroot .heads{display:flex; justify-content:space-between; margin-top:44px; gap:24px;}
.tlroot .hd{display:flex; align-items:center; gap:13px; max-width:44%;}
.tlroot .hd.b{flex-direction:row-reverse; text-align:right;}
.tlroot .hd .hname{font-size:17px; font-weight:800; letter-spacing:.01em;}
.tlroot .hd .hdesc{font-size:12px; line-height:1.55; margin-top:3px; white-space:pre-wrap;}
.tlroot .body{position:relative; margin-top:20px; padding-top:26px;}
.tlroot .body.cont{margin-top:0;}
.tlroot .rail{position:absolute; top:0; bottom:6px; width:2px;}
.tlroot .rail.a{left:calc(7% - 1px);}
.tlroot .rail.b{right:calc(7% - 1px);}
.tlroot .item{position:relative; margin-bottom:var(--gap,26px);}
.tlroot .item:last-child{margin-bottom:0;}
.tlroot .node{position:absolute; top:17px; width:12px; height:12px; border-radius:50%; z-index:2;}
.tlroot .node.na{left:7%; transform:translate(-50%,-50%);}
.tlroot .node.nb{right:7%; transform:translate(50%,-50%);}
.tlroot .fw.node{width:30px; height:30px;}
.tlroot .node.dia{border-radius:3px; width:12px; height:12px;}
.tlroot .node.dia.na{transform:translate(-50%,-50%) rotate(45deg);}
.tlroot .node.dia.nb{transform:translate(50%,-50%) rotate(45deg);}
.tlroot .connector{position:absolute; top:17px; height:2px; z-index:1;}
.tlroot .evcard{border-radius:12px; padding:14px 17px; position:relative;}
.tlroot .item.a .evcard{margin-left:calc(7% + 26px); width:40%;}
.tlroot .item.a .connector{left:7%; width:26px;}
.tlroot .item.b .evcard{margin-left:auto; margin-right:calc(7% + 26px); width:40%; text-align:right;}
.tlroot .item.b .connector{right:7%; width:26px;}
.tlroot .item.x .evcard{width:60%; margin:0 auto; text-align:center; padding:16px 22px; overflow:hidden;}
.tlroot .item.x .xbar{position:absolute; top:0; left:0; right:0; height:2.5px;}
.tlroot .item.x .connector{width:13%;}
.tlroot .item.x .connector.ca{left:7%;}
.tlroot .item.x .connector.cb{right:7%;}
.tlroot .etime{font-size:12px; font-weight:700; letter-spacing:.05em; margin-bottom:5px;}
.tlroot .etitle{font-size:16px; font-weight:700; line-height:1.35;}
.tlroot .edesc{font-size:12.5px; margin-top:6px; line-height:1.65; white-space:pre-wrap;}
.tlroot .divider{margin:calc(var(--gap,26px) + 12px) 7%; text-align:center;}
.tlroot .divider .dtop{display:flex; align-items:center; gap:14px;}
.tlroot .divider .dl{flex:1; height:1.5px;}
.tlroot .divider .dtxt{font-size:12.5px; font-weight:700; letter-spacing:.14em; white-space:pre-wrap;}
.tlroot .divider .dtime{font-size:11px; font-weight:600; letter-spacing:.1em; margin-bottom:7px;}
.tlroot .divider .ddesc{font-size:12px; margin-top:8px; line-height:1.7; white-space:pre-wrap;}
.tlroot .footnote{margin-top:46px; text-align:center; font-size:12px; line-height:1.8; white-space:pre-wrap; padding-top:20px; position:relative;}
</style>
</head>
<body>
<div class="app">

  <!-- ══════════ 편집 패널 ══════════ -->
  <div class="editor">

    <div class="card">
      <h2>기본 설정</h2>
      <div class="row"><label class="small">제목</label><input type="text" id="inTitle" placeholder="타임라인 제목" value="TIMELINE"></div>
      <div class="row"><label class="small">배경</label>
        <input type="color" id="bg1"><input type="color" id="bg2">
        <button class="mini grd" id="bgGrad" title="단색 ↔ 그라데이션"><span></span></button>
        <button class="mini" id="bgPreset" title="추천 색 넘겨보기">추천 ▸</button>
      </div>
      <div class="row"><label class="small">글꼴</label>
        <select id="inFont">
          <option value="system">시스템 기본</option>
          <option value="pretendard">프리텐다드</option>
          <option value="notosans">노토 산스</option>
          <option value="notoserif">노토 세리프 (명조)</option>
          <option value="gowun">고운바탕</option>
        </select>
      </div>
      <div class="row"><label class="small">폭</label>
        <input type="number" id="inWidth" min="600" max="2000" step="10" value="1080">
        <span style="font-size:12px;color:var(--muted);flex-shrink:0;">px</span>
      </div>
    </div>

    <div class="card">
      <h2>페어</h2>
      <div class="row">
        <img class="thumb sq empty" id="thP" alt="">
        <button class="mini" id="imgBtnP">페어 이미지</button><button class="mini" id="imgDelP" style="display:none">✕</button><button class="mini" id="adjBtnP" style="display:none">조정</button><button class="mini" id="pickBtn" style="display:none">색 뽑기</button>
      </div>
      <div class="row" id="bannerOptRow" style="display:none"><label class="small">배너</label>
        <select id="inPairRatio">
          <option value="21/9" selected>와이드</option>
          <option value="16/9">16:9</option>
          <option value="0">원본</option>
        </select>
        <select id="inPairStyle">
          <option value="card">카드형</option>
          <option value="fade">페이드형</option>
        </select>
      </div>
      <input type="file" id="fileImgP" accept="image/*" hidden>
      <div class="adjrows" id="adjP" style="display:none">
        <div class="row"><label>가로</label><input type="range" id="posxP" min="0" max="100" value="50"></div>
        <div class="row"><label>세로</label><input type="range" id="posyP" min="0" max="100" value="50"></div>
        <div class="row"><label>확대</label><input type="range" id="zoomP" min="100" max="250" value="100"></div>
      </div>
      <div class="row"><label class="small">페어색</label>
        <div class="seg" style="width:auto;flex:1;"><button id="pairAuto" class="on">A × B 자동</button><button id="pairCustom">직접 지정</button></div>
      </div>
      <div class="row" id="pairColRow" style="display:none"><label class="small"></label>
        <input type="color" id="pc1"><input type="color" id="pc2">
        <button class="mini grd" id="pcGrad" title="단색 ↔ 그라데이션"><span></span></button>
        <button class="mini" id="pcPreset">추천 ▸</button>
      </div>
      <div class="row"><textarea id="inSynopsis" placeholder="서사 요약 (선택)"></textarea></div>
      <div class="row"><textarea id="inFootnote" style="min-height:44px;" placeholder="맺음말 (선택)"></textarea></div>
    </div>

    <div class="card">
      <h2>캐릭터</h2>
      <div class="row">
        <img class="thumb empty" id="thA" alt="">
        <input type="color" id="ca1"><input type="color" id="ca2">
        <button class="mini grd" id="caGrad" title="단색 ↔ 그라데이션"><span></span></button><button class="mini" id="caPreset">추천 ▸</button>
        <button class="mini" id="imgBtnA">사진</button><button class="mini" id="imgDelA" style="display:none">✕</button><button class="mini" id="adjBtnA" style="display:none">조정</button>
      </div>
      <div class="adjrows" id="adjA" style="display:none">
        <div class="row"><label>가로</label><input type="range" id="posxA" min="0" max="100" value="50"></div>
        <div class="row"><label>세로</label><input type="range" id="posyA" min="0" max="100" value="50"></div>
        <div class="row"><label>확대</label><input type="range" id="zoomA" min="100" max="250" value="100"></div>
      </div>
      <div class="row"><input type="text" id="nameA" placeholder="캐릭터 A 이름" value="A"></div>
      <div class="row"><input type="text" id="descA" placeholder="A 한 줄 소개 (선택)"></div>

      <div class="row" style="margin-top:14px;">
        <img class="thumb empty" id="thB" alt="">
        <input type="color" id="cb1"><input type="color" id="cb2">
        <button class="mini grd" id="cbGrad" title="단색 ↔ 그라데이션"><span></span></button><button class="mini" id="cbPreset">추천 ▸</button>
        <button class="mini" id="imgBtnB">사진</button><button class="mini" id="imgDelB" style="display:none">✕</button><button class="mini" id="adjBtnB" style="display:none">조정</button>
      </div>
      <div class="adjrows" id="adjB" style="display:none">
        <div class="row"><label>가로</label><input type="range" id="posxB" min="0" max="100" value="50"></div>
        <div class="row"><label>세로</label><input type="range" id="posyB" min="0" max="100" value="50"></div>
        <div class="row"><label>확대</label><input type="range" id="zoomB" min="100" max="250" value="100"></div>
      </div>
      <div class="row"><input type="text" id="nameB" placeholder="캐릭터 B 이름" value="B"></div>
      <div class="row"><input type="text" id="descB" placeholder="B 한 줄 소개 (선택)"></div>
      <input type="file" id="fileImgA" accept="image/*" hidden>
      <input type="file" id="fileImgB" accept="image/*" hidden>
      <div class="row" style="margin-top:10px;"><label class="chk"><input type="checkbox" id="chkAvatars" checked> 이벤트 축에도 얼굴 표시</label></div>
    </div>

    <div class="card">
      <h2>이벤트</h2>
      <div class="row">
        <div class="seg" id="ownerSeg">
          <button data-o="A" class="on">A</button>
          <button data-o="X">접점</button>
          <button data-o="B">B</button>
          <button data-o="D">구분선</button>
        </div>
      </div>
      <div class="row" id="bigRow" style="display:none;"><label class="chk"><input type="checkbox" id="inBig"> 강조 — 큰 접점으로 표시</label></div>
      <div class="row"><input type="text" id="inTime" placeholder="시점 (선택)"></div>
      <div class="row"><input type="text" id="inEvTitle" placeholder="사건 제목"></div>
      <div class="row"><textarea id="inDesc" placeholder="설명 (선택)"></textarea></div>
      <div class="row">
        <button class="btn wide" id="btnAdd">추가</button>
        <button class="btn ghost" id="btnCancelEdit" style="display:none;">취소</button>
      </div>
      <div class="hint">Enter로 추가 · ⠿ 드래그로 순서 변경</div>

      <div class="evlist" id="evList"></div>

      <details class="adv">
        <summary>텍스트로 일괄 입력</summary>
        <div class="inner">
          <textarea id="bulkText" style="min-height:90px;" placeholder="A | 시점 | 사건 제목 | 설명&#10;구분 | 구분선 문구&#10;접점! | 시점 | 강조된 접점"></textarea>
          <div class="hint">형식: A·B·접점·구분 | 시점 | 제목 | 설명<br>시점 생략: 구분 | 문구 · 강조 접점: 접점! | 제목</div>
          <button class="btn ghost wide" id="btnBulk" style="margin-top:8px;">일괄 추가</button>
        </div>
      </details>
    </div>

    <div class="card">
      <h2>저장</h2>
      <div class="row">
        <button class="btn ghost wide" id="btnSaveHtml" title="완성본 보관과 재편집이 모두 되는 파일">HTML로 저장</button>
        <button class="btn ghost wide" id="btnLoad">불러오기</button>
        <input type="file" id="fileLoad" accept=".html,.htm,.json" hidden>
      </div>
      <div class="row" style="justify-content:space-between;">
        <span id="saveStatus">자동 저장</span>
        <button class="mini" id="btnReset">새로 만들기</button>
      </div>
    </div>
  </div>

  <!-- ══════════ 미리보기 ══════════ -->
  <div class="stage">
    <div class="stagebar">
      <span style="font-size:12px;color:var(--muted);font-weight:600;">미리보기</span>
      <button class="mini" id="zoomBtn">확대</button>
      <span class="sp"></span>
      <select id="inSplit" title="긴 타임라인 나눠 저장">
        <option value="none">한 장으로</option>
        <option value="divider">구분선마다 나누기</option>
        <option value="count">12개씩 나누기</option>
      </select>
      <select id="inScale" title="저장 해상도">
        <option value="2">고화질</option>
        <option value="1">표준</option>
      </select>
      <button class="btn" id="btnPng">🖼 PNG로 저장</button>
    </div>
    <div class="viewport" id="viewport">
      <div id="scaler"><div id="tl" class="tlroot"></div></div>
    </div>
  </div>
</div>

<button id="jumpBtn" class="btn">미리보기 ↓</button>

<script>
/* ───────────── 글꼴 · 팔레트 ───────────── */
const FONTS = {
  system:    {css:null, family:'-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif'},
  pretendard:{css:"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css", family:'"Pretendard Variable",Pretendard,sans-serif'},
  notosans:  {css:"https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap", family:'"Noto Sans KR",sans-serif'},
  notoserif: {css:"https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&display=swap", family:'"Noto Serif KR",serif'},
  gowun:     {css:"https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap", family:'"Gowun Batang",serif'}
};
function ensureFont(key){
  const f = FONTS[key];
  if(f && f.css && !document.getElementById("font-"+key)){
    const l = document.createElement("link");
    l.rel = "stylesheet"; l.href = f.css; l.id = "font-"+key;
    document.head.appendChild(l);
  }
}

/* ───────────── 색 유틸 ───────────── */
function hexRgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function lum(h){ const [r,g,b]=hexRgb(h).map(v=>{v/=255; return v<=.03928? v/12.92 : Math.pow((v+.055)/1.055,2.4);}); return .2126*r+.7152*g+.0722*b; }
function rgba(h,a){ const [r,g,b]=hexRgb(h); return `rgba(${r},${g},${b},${a})`; }
function blendHex(h1,h2){ const a=hexRgb(h1), b=hexRgb(h2); return "#"+a.map((v,i)=>Math.round((v+b[i])/2).toString(16).padStart(2,"0")).join(""); }
const cssCol   = (col, ang="135deg") => col.grad ? `linear-gradient(${ang}, ${col.c1}, ${col.c2})` : col.c1;
const solidCol = col => col.grad ? blendHex(col.c1, col.c2) : col.c1;
const pairCol  = () => state.pair.auto
  ? {grad:true, c1:solidCol(state.chars.A.color), c2:solidCol(state.chars.B.color)}
  : state.pair.color;

function imgBox(src, pos, style){
  const z = pos.z*100, off = (100-z)/2;
  return `<span class="fw" style="${style}"><img src="${src}" style="width:${z}%;height:${z}%;left:${off}%;top:${off}%;object-position:${pos.x}% ${pos.y}%;"></span>`;
}

/* ───────────── 페이드 배너: 이미지에 알파 페이드를 직접 굽는다 ───────────── */
let fadeCache = {key:null, url:null};
let fadePending = false;
function fadeKey(){
  const p = state.pairPos;
  return [state.pairImg ? state.pairImg.length : 0, state.pairRatio, state.width, p.x, p.y, p.z].join("|");
}
function scheduleFadeBanner(){
  if(fadePending || !state.pairImg) return;
  fadePending = true;
  const key = fadeKey();
  const img = new Image();
  img.onload = ()=>{
    const W = state.width;
    let H;
    if(state.pairRatio === "0"){
      H = Math.round(W * img.height / img.width);
    }else{
      const [ra, rb] = state.pairRatio.split("/").map(Number);
      H = Math.round(W * rb / ra);
    }
    const cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    const cx = cv.getContext("2d");
    if(state.pairRatio === "0"){
      cx.drawImage(img, 0, 0, W, H);
    }else{
      const sc = Math.max(W/img.width, H/img.height) * state.pairPos.z;
      const dw = img.width*sc, dh = img.height*sc;
      const dx = (W-dw)*state.pairPos.x/100, dy = (H-dh)*state.pairPos.y/100;
      cx.drawImage(img, dx, dy, dw, dh);
    }
    const gr = cx.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0,   "rgba(0,0,0,0)");
    gr.addColorStop(.38, "rgba(0,0,0,0)");
    gr.addColorStop(.52, "rgba(0,0,0,.16)");
    gr.addColorStop(.66, "rgba(0,0,0,.42)");
    gr.addColorStop(.78, "rgba(0,0,0,.7)");
    gr.addColorStop(.87, "rgba(0,0,0,.92)");
    gr.addColorStop(.93, "rgba(0,0,0,1)");
    gr.addColorStop(1,   "rgba(0,0,0,1)");
    cx.globalCompositeOperation = "destination-out";
    cx.fillStyle = gr;
    cx.fillRect(0, 0, W, H);
    fadePending = false;
    fadeCache = {key, url: cv.toDataURL("image/png")};
    if(key === fadeKey()) render();
  };
  img.src = state.pairImg;
}

/* ───────────── 타임라인 HTML 생성 (미리보기·분할 저장 공용) ───────────── */
function buildTL(events, opts){
  const {A,B} = state.chars;
  const P = pairCol();
  const bgSolid = solidCol(state.bg);
  const dark = lum(bgSolid) < 0.5;
  const mut   = dark ? "rgba(242,242,240,.6)" : "rgba(27,27,30,.6)";
  const faint = dark ? "rgba(242,242,240,.28)" : "rgba(27,27,30,.25)";
  const cardBg= dark ? "rgba(255,255,255,.05)" : "rgba(0,0,0,.04)";
  const aS = solidCol(A.color), bS = solidCol(B.color), pS = solidCol(P);
  const rule = `<span style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:44px;height:2px;background:${cssCol(P,"90deg")};"></span>`;

  let html = "";

  if(opts.header){
    if(state.pairImg){
      const fade = state.pairStyle === "fade";
      if(fade && fadeCache.key === fadeKey() && fadeCache.url){
        html += `<div class="banner fade"><img src="${fadeCache.url}" style="position:static; width:100%; height:auto; display:block;"></div>`;
      }else{
        if(fade) scheduleFadeBanner();
        const bf = fade ? `<div class="bfade" style="background:linear-gradient(180deg, rgba(0,0,0,0) 45%, ${state.bg.c1} 99%);"></div>` : "";
        if(state.pairRatio === "0"){
          html += `<div class="banner orig${fade?" fade":""}"><img src="${state.pairImg}">${bf}</div>`;
        }else{
          const z = state.pairPos.z*100, off = (100-z)/2;
          html += `<div class="banner${fade?" fade":""}" style="aspect-ratio:${state.pairRatio};">
            <img src="${state.pairImg}" style="width:${z}%;height:${z}%;left:${off}%;top:${off}%;object-position:${state.pairPos.x}% ${state.pairPos.y}%;">${bf}
          </div>`;
        }
      }
    }
    html += `<div class="tl-title">${esc(state.title)}</div>`;
    if(state.synopsis.trim()) html += `<div class="synopsis" style="color:${mut};">${rule}${esc(state.synopsis)}</div>`;
    const hd = (ch, side) => `
      <div class="hd ${side}">
        ${ch.img ? imgBox(ch.img, ch.pos, `width:54px;height:54px;border:2.5px solid ${solidCol(ch.color)};`) : ""}
        <div>
          <div class="hname" style="color:${solidCol(ch.color)}">${esc(ch.name)}</div>
          ${ch.desc ? `<div class="hdesc" style="color:${mut}">${esc(ch.desc)}</div>` : ""}
        </div>
      </div>`;
    html += `<div class="heads">${hd(A,"a")}${hd(B,"b")}</div>`;
  }

  const railCss = col => col.grad
    ? `linear-gradient(to bottom, ${col.c1}, ${col.c2} 55%, ${rgba(col.c2,.4)} 82%, transparent)`
    : `linear-gradient(to bottom, ${col.c1}, ${rgba(col.c1,.5)} 70%, transparent)`;
  html += `<div class="body${opts.header?"":" cont"}">
    <div class="rail a" style="background:${railCss(A.color)};"></div>
    <div class="rail b" style="background:${railCss(B.color)};"></div>`;

  for(const ev of events){
    if(ev.owner === "D"){
      html += `
      <div class="divider" data-eid="${ev.id}">
        ${ev.time?`<div class="dtime" style="color:${mut}">${esc(ev.time)}</div>`:""}
        <div class="dtop">
          <span class="dl" style="background:linear-gradient(90deg, transparent, ${faint});"></span>
          <span class="dtxt" style="color:${dark?"rgba(242,242,240,.85)":"rgba(27,27,30,.8)"}">${esc(ev.title)}</span>
          <span class="dl" style="background:linear-gradient(270deg, transparent, ${faint});"></span>
        </div>
        ${ev.desc?`<div class="ddesc" style="color:${mut}">${esc(ev.desc)}</div>`:""}
      </div>`;
    }else if(ev.owner === "X"){
      const big = !!ev.big;
      const dia = big ? 15 : 12;
      const pc1 = P.grad?P.c1:pS, pc2 = P.grad?P.c2:pS;
      const xBg = big ? `linear-gradient(90deg, ${rgba(pc1,.15)}, ${rgba(pc2,.15)})` : cardBg;
      html += `
      <div class="item x" data-eid="${ev.id}">
        <div class="node dia na" style="background:${P.grad?P.c1:pS}; box-shadow:0 0 0 4px ${bgSolid}; width:${dia}px; height:${dia}px;"></div>
        <div class="node dia nb" style="background:${P.grad?P.c2:pS}; box-shadow:0 0 0 4px ${bgSolid}; width:${dia}px; height:${dia}px;"></div>
        <div class="connector ca" style="background:linear-gradient(90deg, ${pc1}, ${rgba(pc1,.2)});"></div>
        <div class="connector cb" style="background:linear-gradient(270deg, ${pc2}, ${rgba(pc2,.2)});"></div>
        <div class="evcard" style="background:${xBg};">
          <div class="xbar" style="background:${cssCol(P,"90deg")};${big?" height:3.5px;":""}"></div>
          ${ev.time?`<div class="etime" style="color:${pS};">${esc(ev.time)}</div>`:""}
          <div class="etitle"${big?' style="font-size:17.5px;"':""}>${esc(ev.title)}</div>
          ${ev.desc?`<div class="edesc" style="color:${mut}">${esc(ev.desc)}</div>`:""}
        </div>
      </div>`;
    }else{
      const isA = ev.owner==="A";
      const ch = isA ? A : B;
      const cS = isA ? aS : bS;
      const useFace = state.showAvatars && ch.img;
      html += `
      <div class="item ${isA?"a":"b"}" data-eid="${ev.id}">
        ${useFace
          ? imgBox(ch.img, ch.pos, `border:2.5px solid ${cS}; box-shadow:0 0 0 4px ${bgSolid};`).replace('class="fw"', `class="fw node ${isA?"na":"nb"}"`)
          : `<div class="node ${isA?"na":"nb"}" style="background:${cssCol(ch.color)}; box-shadow:0 0 0 4px ${bgSolid};"></div>`}
        <div class="connector" style="background:linear-gradient(${isA?"90deg":"270deg"}, ${cS}, ${rgba(cS,.15)});"></div>
        <div class="evcard" style="background:${cardBg};">
          ${ev.time?`<div class="etime" style="color:${cS}">${esc(ev.time)}</div>`:""}
          <div class="etitle">${esc(ev.title)}</div>
          ${ev.desc?`<div class="edesc" style="color:${mut}">${esc(ev.desc)}</div>`:""}
        </div>
      </div>`;
    }
  }
  html += `</div>`;

  if(opts.footer && state.footnote.trim()){
    html += `<div class="footnote" style="color:${mut};">${rule}${esc(state.footnote)}</div>`;
  }
  return html;
}

/* ───────────── 색 컨트롤 ───────────── */
function wireColor(prefix, getCol, presetList, presetKey){
  const i1 = $("#"+prefix+"1"), i2 = $("#"+prefix+"2");
  const g = $("#"+prefix+"Grad"), p = $("#"+prefix+"Preset");
  function sync(){
    const col = getCol();
    i1.value = col.c1; i2.value = col.c2;
    i2.style.display = col.grad ? "" : "none";
    g.classList.toggle("on", col.grad);
    g.querySelector("span").style.background = `linear-gradient(135deg, ${col.c1}, ${col.c2})`;
  }
  i1.addEventListener("input", e=>{ getCol().c1 = e.target.value; sync(); render(); });
  i2.addEventListener("input", e=>{ getCol().c2 = e.target.value; sync(); render(); });
  g.addEventListener("click", ()=>{ const col=getCol(); col.grad=!col.grad; sync(); render(); });
  p.addEventListener("click", ()=>{
    const col = getCol();
    presetIdx[presetKey] = (presetIdx[presetKey]+1) % presetList.length;
    [col.c1, col.c2] = presetList[presetIdx[presetKey]];
    col.grad = true; sync(); render();
  });
  return sync;
}
const syncBg = wireColor("bg", ()=>state.bg, BG_PRESETS, "bg");
const syncCa = wireColor("ca", ()=>state.chars.A.color, CH_PRESETS, "A");
const syncCb = wireColor("cb", ()=>state.chars.B.color, CH_PRESETS, "B");
const syncPc = wireColor("pc", ()=>state.pair.color, CH_PRESETS, "P");

  }

function getPos(k){ return k==="P" ? state.pairPos : state.chars[k].pos; }
function syncSliders(k){
  const p = getPos(k);
  $("#posx"+k).value = p.x; $("#posy"+k).value = p.y; $("#zoom"+k).value = Math.round(p.z*100);
}
function loadImage(file, maxPx, jpeg, cb){
  const r = new FileReader();
  r.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const s = Math.min(1, maxPx / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width*s); cv.height = Math.round(img.height*s);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      cb(jpeg ? cv.toDataURL("image/jpeg", .87) : cv.toDataURL("image/png"));
      refreshThumbs(); render();
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

      if(k==="P") loadImage(e.target.files[0], 1400, true, d=>{ state.pairImg=d; state.pairPos=defPos(); syncSliders(k); });
      else loadImage(e.target.files[0], 256, false, d=>{ state.chars[k].img=d; state.chars[k].pos=defPos(); syncSliders(k); });
    }
    e.target.value="";
  });
  $("#imgDel"+k).addEventListener("click", ()=>{
    if(k==="P") state.pairImg=null; else state.chars[k].img=null;
    refreshThumbs(); render();

  $("#adjBtn"+k).addEventListener("click", ()=>{

  $("#posy"+k).addEventListener("input", e=>{ getPos(k).y=+e.target.value; render(); });
  $("#zoom"+k).addEventListener("input", e=>{ getPos(k).z=+e.target.value/100; render(); });
}

/* ───────────── 사진에서 색 뽑기 ───────────── */
function shade(h, f){ const [r,g,b]=hexRgb(h); return "#"+[r,g,b].map(v=>Math.round(v*f).toString(16).padStart(2,"0")).join(""); }
$("#pickBtn").addEventListener("click", ()=>{
  if(!state.pairImg) return;
  const img = new Image();
  img.onload = ()=>{
    const S=48, cv=document.createElement("canvas");
    cv.width=S; cv.height=S;
    const cx=cv.getContext("2d"); cx.drawImage(img,0,0,S,S);
    const d=cx.getImageData(0,0,S,S).data, buckets={};
    for(let i=0;i<d.length;i+=4){
      const r=d[i],g=d[i+1],b=d[i+2];
      const v=Math.max(r,g,b), sat=v-Math.min(r,g,b);
      if(v<45) continue;
      const key=(r>>5)+","+(g>>5)+","+(b>>5);
      const bk=buckets[key]||(buckets[key]={r:0,g:0,b:0,n:0,w:0});
      bk.r+=r; bk.g+=g; bk.b+=b; bk.n++; bk.w+=1+sat/48;
    }
    const sorted=Object.values(buckets).sort((x,y)=>y.w-x.w);
    if(!sorted.length) return;
    const hex=bk=>"#"+[bk.r/bk.n,bk.g/bk.n,bk.b/bk.n].map(v=>Math.round(v).toString(16).padStart(2,"0")).join("");
    const m1=sorted[0];
    let m2=m1;
    for(const bk of sorted.slice(1)){
      const dr=bk.r/bk.n-m1.r/m1.n, dg=bk.g/bk.n-m1.g/m1.n, db=bk.b/bk.n-m1.b/m1.n;
      if(dr*dr+dg*dg+db*db>2800){ m2=bk; break; }
    }
    const x1=hex(m1), x2=hex(m2);
    state.bg = {grad:true, c1:shade(x1,.24), c2:shade(x2,.3)};
    state.pair = {auto:false, color:{grad:true, c1:x1, c2:x2}};
    syncBg(); syncPc(); syncPairSeg(); render();
  };
  img.src = state.pairImg;
});

/* ───────────── 드래그 정렬 ───────────── */
let dragId = null;
$("#evList").addEventListener("dragstart", e=>{
  const row = e.target.closest(".ev"); if(!row) return;
  dragId = +row.dataset.id; row.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
});
$("#evList").addEventListener("dragend", ()=>{ dragId=null; render(); });
$("#evList").addEventListener("dragover", e=>{
  e.preventDefault();
  const row = e.target.closest(".ev");
  if(!row || dragId==null || +row.dataset.id===dragId) return;
  const from = state.events.findIndex(v=>v.id===dragId);
  const to   = state.events.findIndex(v=>v.id===+row.dataset.id);
  const [m] = state.events.splice(from,1);
  state.events.splice(to,0,m);
  renderList();
  document.querySelector(`.ev[data-id="${dragId}"]`)?.classList.add("dragging");
});

/* ───────────── 입력 바인딩 ───────────── */
function bind(id, fn){ $(id).addEventListener("input", e=>{ fn(e.target.value); render(); }); }
bind("#inTitle",   v=> state.title=v);
bind("#nameA",     v=> state.chars.A.name=v||"A");
bind("#nameB",     v=> state.chars.B.name=v||"B");
bind("#descA",     v=> state.chars.A.desc=v);
bind("#descB",     v=> state.chars.B.desc=v);
bind("#inSynopsis",v=> state.synopsis=v);
bind("#inFootnote",v=> state.footnote=v);
$("#inWidth").addEventListener("change", e=>{
  let v = Math.round(+e.target.value || 1080);
  v = Math.min(2000, Math.max(600, v));
  e.target.value = v; state.width = v; render();
});
$("#inFont").addEventListener("change", e=>{ state.font=e.target.value; ensureFont(state.font); render(); });
$("#inPairRatio").addEventListener("change", e=>{ state.pairRatio=e.target.value; render(); });
$("#inPairStyle").addEventListener("change", e=>{ state.pairStyle=e.target.value; render(); });
$("#chkAvatars").addEventListener("change", e=>{ state.showAvatars=e.target.checked; render(); });

$("#ownerSeg").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  curOwner = b.dataset.o;
  document.querySelectorAll("#ownerSeg button").forEach(x=>x.classList.toggle("on", x===b));
  $("#inEvTitle").placeholder = curOwner==="D" ? "구분선 문구" : "사건 제목";
  $("#bigRow").style.display = curOwner==="X" ? "" : "none";
});

function clearForm(){
  $("#inTime").value=""; $("#inEvTitle").value=""; $("#inDesc").value=""; $("#inBig").checked=false;
  editingId=null; $("#btnAdd").textContent="추가"; $("#btnCancelEdit").style.display="none";
}
function addOrSave(){
  const title = $("#inEvTitle").value.trim();
  if(!title){ $("#inEvTitle").focus(); return; }
  const data = {owner:curOwner, time:$("#inTime").value.trim(), title, desc:$("#inDesc").value.trim(), big: curOwner==="X" && $("#inBig").checked};
  if(editingId!=null) Object.assign(state.events.find(e=>e.id===editingId), data);
  else state.events.push({id:nextId++, ...data});
  clearForm(); render();
}
function startEdit(id){
  const ev = state.events.find(v=>v.id===id); if(!ev) return;
  editingId = ev.id; curOwner = ev.owner;
  document.querySelectorAll("#ownerSeg button").forEach(x=>x.classList.toggle("on", x.dataset.o===ev.owner));
  $("#bigRow").style.display = ev.owner==="X" ? "" : "none";
  $("#inBig").checked = !!ev.big;
  $("#inTime").value=ev.time; $("#inEvTitle").value=ev.title; $("#inDesc").value=ev.desc;
  $("#btnAdd").textContent="수정 저장"; $("#btnCancelEdit").style.display="";
  render();
}
$("#tl").addEventListener("click", e=>{
  const t = e.target.closest("[data-eid]"); if(!t) return;
  startEdit(+t.dataset.eid);
  $("#inEvTitle").scrollIntoView({behavior:"smooth", block:"center"});
});
$("#btnAdd").addEventListener("click", addOrSave);
$("#btnCancelEdit").addEventListener("click", ()=>{ clearForm(); render(); });
["#inTime","#inEvTitle"].forEach(s=> $(s).addEventListener("keydown", e=>{ if(e.key==="Enter") addOrSave(); }));

$("#evList").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  const id = +b.closest(".ev").dataset.id;
  const i = state.events.findIndex(ev=>ev.id===id);
  const act = b.dataset.act;
  if(act==="del"){ state.events.splice(i,1); if(editingId===id) clearForm(); }
  if(act==="up" && i>0)[state.events[i-1],state.events[i]]=[state.events[i],state.events[i-1]];
  if(act==="down" && i<state.events.length-1)[state.events[i+1],state.events[i]]=[state.events[i],state.events[i+1]];
  if(act==="edit"){ startEdit(id); return; }
  render();
});

/* 일괄 입력 */
$("#btnBulk").addEventListener("click", ()=>{
  const lines = $("#bulkText").value.split("\n").map(l=>l.trim()).filter(Boolean);
  for(const line of lines){
    const p = line.split("|").map(s=>s.trim());
    if(p.length<2) continue;
    let o = p[0].toUpperCase();
    const bang = o.endsWith("!"); if(bang) o = o.slice(0,-1);
    const owner = (o==="A")?"A" : (o==="B")?"B" : (o==="구분"||o==="D"||o==="-")?"D" : "X";
    const big = owner==="X" && bang;
    if(p.length===2) state.events.push({id:nextId++, owner, time:"", title:p[1], desc:"", big});
    else state.events.push({id:nextId++, owner, time:p[1], title:p[2], desc:p[3]||"", big});
  }
  $("#bulkText").value="";
  render();
});

/* ───────────── 상태 적용 ───────────── */
function migrateColor(c, fb){
  if(!c) return {grad:false, c1:fb, c2:fb};
  if(typeof c === "string") return {grad:false, c1:c, c2:c};
  return Object.assign({grad:false, c1:fb, c2:fb}, c);
}
function applyState(s){
  state = Object.assign(defaultState(), s);
  state.bg = migrateColor(state.bg, "#15171e");
  for(const k of ["A","B"]){
    state.chars[k] = Object.assign({img:null, desc:"", pos:defPos()}, state.chars[k]);
    state.chars[k].color = migrateColor(state.chars[k].color, k==="A"?"#6ea8ff":"#ff8fa8");
    state.chars[k].pos = Object.assign(defPos(), state.chars[k].pos);
  }
  state.pair = Object.assign({auto:true, color:{grad:true,c1:"#6ea8ff",c2:"#ff8fa8"}}, state.pair);
  state.pair.color = migrateColor(state.pair.color, "#a89bd0");
  state.pairPos = Object.assign(defPos(), state.pairPos);
  nextId = Math.max(0, ...state.events.map(e=>e.id)) + 1;
  ensureFont(state.font);

  $("#inTitle").value=state.title; $("#inWidth").value=state.width; $("#inFont").value=state.font;
  $("#nameA").value=state.chars.A.name; $("#descA").value=state.chars.A.desc;
  $("#nameB").value=state.chars.B.name; $("#descB").value=state.chars.B.desc;
  $("#inSynopsis").value=state.synopsis; $("#inFootnote").value=state.footnote;
  $("#inPairRatio").value=state.pairRatio; $("#inPairStyle").value=state.pairStyle; $("#chkAvatars").checked=state.showAvatars;
  syncBg(); syncCa(); syncCb(); syncPc(); syncPairSeg();
  for(const k of ["A","B","P"]) syncSliders(k);
  clearForm(); refreshThumbs(); render();
}

/* ───────────── HTML 저장 / 불러오기 ───────────── */
$("#btnSaveHtml").addEventListener("click", ()=>{
  const f = FONTS[state.font];
  const fontLink = f.css ? `<link rel="stylesheet" href="${f.css}">` : "";
  const styles = document.querySelector("style").textContent;
  const json = JSON.stringify(state).replace(/</g, "\\u003c");
  const doc = `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${esc(state.title)}</title>
${fontLink}
<style>
${styles}
body{background:${solidCol(state.bg)}; display:block; overflow-x:auto; padding:24px 0;}
.tlroot{margin:0 auto;}
</style>
</head>
<body>
${$("#tl").outerHTML}
<script type="application/json" id="ctl-data">${json}<\/script>
</body>
</html>`;
  const blob = new Blob([doc], {type:"text/html"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (state.title||"timeline") + ".html";
  a.click(); URL.revokeObjectURL(a.href);
});

$("#btnLoad").addEventListener("click", ()=> $("#fileLoad").click());
$("#fileLoad").addEventListener("change", e=>{
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const text = r.result.trim();
      let s;
      if(text.startsWith("<")){
        const m = text.match(/<script[^>]*id="ctl-data"[^>]*>([\s\S]*?)<\/script>/);
        if(!m) throw 0;
        s = JSON.parse(m[1]);
      }else{
        s = JSON.parse(text);
      }
      if(!s.events || !s.chars) throw 0;
      applyState(s);
    }catch{ alert("이 툴에서 저장한 HTML 또는 JSON 파일이 아닙니다."); }
  };
  r.readAsText(file);
  e.target.value="";
});

$("#btnReset").addEventListener("click", ()=>{
  if(!confirm("모든 내용을 지우고 새로 시작할까요?")) return;
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  applyState(defaultState());
});

/* ───────────── PNG 내보내기 (분할 지원) ───────────── */
function chunkEvents(mode){
  const evs = state.events;
  if(mode === "divider"){
    const chunks = [];
    let cur = [];
    for(const ev of evs){
      if(ev.owner === "D" && cur.length){ chunks.push(cur); cur = []; }
      cur.push(ev);
    }
    if(cur.length) chunks.push(cur);
    return chunks.length ? chunks : [evs];
  }
  if(mode === "count"){
    const N = 12, chunks = [];
    for(let i=0; i<evs.length; i+=N) chunks.push(evs.slice(i, i+N));
    return chunks.length ? chunks : [evs];
  }
  return [evs];
}
async function renderPart(events, opts, scale){
  const wrap = document.createElement("div");
  wrap.style.cssText = `position:fixed; left:-100000px; top:0; width:${state.width}px;`;
  const el = document.createElement("div");
  el.className = "tlroot";
  styleTL(el);
  el.innerHTML = buildTL(events, opts);
  wrap.appendChild(el);
  document.body.appendChild(wrap);
  try{
    const canvas = await html2canvas(el, {scale, backgroundColor:solidCol(state.bg), width:state.width, logging:false});
    const url = canvas.toDataURL("image/png");
    if(url.length < 100) throw new Error("canvas too large");
    return url;
  }finally{ wrap.remove(); }
}
async function exportPng(scale){
  await document.fonts.ready;
  const chunks = chunkEvents($("#inSplit").value);
  const multi = chunks.length > 1;
  for(let i=0; i<chunks.length; i++){
    const url = await renderPart(chunks[i], {header:i===0, footer:i===chunks.length-1}, scale);
    const a = document.createElement("a");
    a.href = url;
    a.download = (state.title||"timeline") + (multi ? `-${i+1}` : "") + ".png";
    a.click();
    if(multi) await new Promise(r=>setTimeout(r, 400));
  }
}
$("#btnPng").addEventListener("click", async ()=>{
  const btn = $("#btnPng");
  btn.disabled = true; btn.textContent = "저장 중…";
  const scale = +$("#inScale").value;
  try{
    await exportPng(scale);
  }catch(err){
    if(scale > 1){
      try{ await exportPng(1); alert("고화질 저장에 실패해 표준 해상도로 저장했습니다."); }
      catch(e2){ alert("이미지 저장에 실패했습니다: " + e2.message); }
    }else{
      alert("이미지 저장에 실패했습니다: " + err.message);
    }
  }finally{
    btn.disabled = false; btn.textContent = "🖼 PNG로 저장";
  }
});

/* ───────────── 모바일 미리보기 점프 ───────────── */
const jb = $("#jumpBtn");
jb.addEventListener("click", ()=>{
  const top = $("#viewport").getBoundingClientRect().top;
  if(top > window.innerHeight*0.6) $("#viewport").scrollIntoView({behavior:"smooth"});
  else window.scrollTo({top:0, behavior:"smooth"});
});
window.addEventListener("scroll", ()=>{
  const top = $("#viewport").getBoundingClientRect().top;
  jb.textContent = top > window.innerHeight*0.6 ? "미리보기 ↓" : "편집 ↑";
}, {passive:true});

/* ───────────── 초기화 ───────────── */
let restored = null;
try{ restored = JSON.parse(localStorage.getItem(STORE_KEY)); }catch(e){}
if(restored && restored.events && restored.chars){
  applyState(restored);
}else{
  syncBg(); syncCa(); syncCb(); syncPc(); syncPairSeg();
  refreshThumbs(); render();
}
</script>
</body>
</html>
