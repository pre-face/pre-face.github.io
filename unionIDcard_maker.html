<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700&family=Saira+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #edecea;
    color: #222;
    font-family: 'Inter', 'Pretendard', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;

  .page-title {

    font-size: 11px;

  .panel {
    width: 256px;
    background: #fff;

  .panel-head {

  .btn-export {

    font-size:10px; color:#c0bdb8;
  }

<script>
let mode = 'formal';
let currentDateSalt = Math.random().toString();
let currentExpirySalt = Math.random().toString();

function onDateMonthChange() {
  currentDateSalt = Math.random().toString();
  rebuild();
}

function onExpiryMonthChange() {
  currentExpirySalt = Math.random().toString();
  rebuild();
}

function setMode(newMode) {
  mode = newMode;
  document.body.classList.toggle('temp-mode', mode === 'temp');
  document.getElementById('card').classList.toggle('temp', mode === 'temp');

  document.getElementById('modeFormal').classList.toggle('active', mode === 'formal');
  document.getElementById('modeTemp').classList.toggle('active', mode === 'temp');
  document.getElementById('modeTemp').classList.toggle('temp', mode === 'temp');

  if (mode === 'temp') {
    document.getElementById('cSub').textContent = 'Temporary Access Pass';
    document.getElementById('cWm').textContent = 'VISITOR';
    document.getElementById('cLblDept').textContent = 'AFFILIATION';
    document.getElementById('cLblIssue').textContent = 'VALID UNTIL';
  } else {
    document.getElementById('cSub').textContent = 'Esper Management Agency';
    document.getElementById('cWm').textContent = 'UNION';
    document.getElementById('cLblDept').textContent = 'DIVISION';
    document.getElementById('cLblIssue').textContent = 'ISSUED';
  }

  rebuild();
}

function h(s) {
  let v = 0;
  for (let i = 0; i < s.length; i++) v = ((v << 5) - v + s.charCodeAt(i)) | 0;
  return Math.abs(v);
}

function agentNo(dept, name, grade) {
  const v = h((dept||'')+'|'+(name||'')+'|'+(grade||''));
  return String(v % 10000).padStart(4,'0') + String(Math.floor(v/10000) % 10000).padStart(4,'0');
}

function drawBarcode(id) {
  const el = document.getElementById('cBc');
  el.innerHTML = '';
  const digits = id.replace(/\D/g, '');
  if (digits.length < 8) return;

  const patterns = [
    [2,1,1,2,1], [1,2,2,1,1], [2,2,1,1,1], [1,1,2,2,1], [2,1,2,1,1],
    [1,2,1,2,1], [1,1,1,3,1], [3,1,1,1,1], [1,3,1,1,1], [1,1,3,1,1],
  ];

  const scale = 2.4;

  function addBar(w, fill) {
    const d = document.createElement('div');
    d.className = 'b ' + (fill ? 'fill' : 'gap');
    d.style.width = (w * scale) + 'px';
    el.appendChild(d);
  }

  addBar(1, true); addBar(1, false); addBar(2, true); addBar(1, false);
  for (let i = 0; i < digits.length; i++) {
    const p = patterns[parseInt(digits[i])];
    p.forEach((w, idx) => addBar(w, idx % 2 === 0));
  }
  addBar(2, true); addBar(1, false); addBar(1, true);
}

function isCJK(text) {
  return /[\u3131-\uD79D\u4E00-\u9FFF\u3040-\u30FF]/.test(text);
}

function computeDate(monthId, manualId, seedSalt) {
  const manual = document.getElementById(manualId).value;
  if (manual && manual.trim()) return manual.trim();

  const month = document.getElementById(monthId).value;
  if (!month) return '';

  const m = parseInt(month);
  const mm = String(m).padStart(2, '0');

  const hYear = h(seedSalt + '|year');
  const year = 20 + (hYear % 11); 

  let maxDay = 31;
  if ([4, 6, 9, 11].includes(m)) maxDay = 30;
  else if (m === 2) maxDay = 28;

  const hDay = h(seedSalt + '|day');
  const day = 1 + (hDay % maxDay);

  return String(year).padStart(2, '0') + '.' + mm + '.' + String(day).padStart(2, '0');
}

function fitName(text) {
  const el = document.getElementById('cName');
  const len = text.length;
  const cjk = isCJK(text);
  el.className = 'c-name' + (cjk || len === 0 ? '' : ' latin');

  let size, spacing;
  if (len === 0) {
    size = '24px'; spacing = '0';
  } else if (cjk) {
    if (len === 1)      { size = '34px'; spacing = '0'; }
    else if (len === 2) { size = '28px'; spacing = '4px'; }
    else if (len <= 4)  { size = '24px'; spacing = '2px'; }
    else if (len <= 7)  { size = '20px'; spacing = '1px'; }
    else if (len <= 10) { size = '16px'; spacing = '0'; }
    else                { size = '14px'; spacing = '-0.5px'; }
  } else {
    if (len <= 6)       { size = '26px'; spacing = '0px'; }
    else if (len <= 9)  { size = '22px'; spacing = '-0.5px'; }
    else if (len <= 12) { size = '18px'; spacing = '-1px'; }
    else if (len <= 16) { size = '15px'; spacing = '-1px'; }
    else if (len <= 20) { size = '13px'; spacing = '-1px'; }
    else                { size = '11px'; spacing = '-1px'; }
  }
  
  el.style.fontSize = size;
  el.style.letterSpacing = spacing;
}

function rebuild() {
  const name    = document.getElementById('inName').value;
  const grade   = document.getElementById('inGrade').value;
  const ability = document.getElementById('inAbility').value;

  let dept;
  if (mode === 'formal') {
    dept = document.getElementById('inDept').value;
  } else {
    dept = document.getElementById('inExtAffil').value || '—';
  }
  document.getElementById('cDept').textContent = dept;

  const date   = computeDate('inDateMonth',   'inDate',   currentDateSalt);
  const expiry = computeDate('inExpiryMonth', 'inExpiry', currentExpirySalt);

  document.getElementById('cName').textContent = name || '―';
  fitName(name);

  if (grade && grade.trim()) {
    document.getElementById('cGrade').textContent = grade;
    document.getElementById('cGrade').classList.remove('empty');
  } else {
    document.getElementById('cGrade').textContent = '—';
    document.getElementById('cGrade').classList.add('empty');
  }

  const optRow = document.getElementById('cOptRow');
  const cellAbility = document.getElementById('cellAbility');
  const cellIssue = document.getElementById('cellIssue');
  const hasAbility = ability.trim().length > 0;
  const dateValue = mode === 'temp' ? expiry : date;
  const hasDate = dateValue.trim().length > 0;

  if (hasAbility) {
    const el = document.getElementById('cAbility');
    el.textContent = ability;
    el.classList.remove('empty');
    cellAbility.classList.remove('hidden-cell');
    const len = ability.length;
    if (len > 14)      el.style.fontSize = '9px';
    else if (len > 9)  el.style.fontSize = '11px';
    else               el.style.fontSize = '13px';
  } else {
    cellAbility.classList.add('hidden-cell');
  }

  if (hasDate) {
    document.getElementById('cDateVal').textContent = dateValue;
    document.getElementById('cDateVal').classList.remove('empty');
    cellIssue.classList.remove('hidden-cell');
  } else {
    cellIssue.classList.add('hidden-cell');
  }

  if (hasDate && !hasAbility) cellIssue.classList.remove('right');
  else                        cellIssue.classList.add('right');

  if (hasAbility || hasDate) optRow.classList.remove('hidden-row');
  else                       optRow.classList.add('hidden-row');

  const idVal = document.getElementById('cIdVal');
  if (name || grade) {
    const id = agentNo(dept, name, grade);
    const prefix = mode === 'temp' ? 'TMP-' : 'UNI-';
    const formattedId = prefix + id.slice(0,4) + '-' + id.slice(4,8);
    idVal.textContent = formattedId;
    idVal.classList.remove('empty');
    drawBarcode(id);
  } else {
    idVal.textContent = '—';
    idVal.classList.add('empty');
    document.getElementById('cBc').innerHTML = '';
  }
}

function onPhoto(e) {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const targetW = 136 * 4;
      const targetH = 174 * 4;
      const canvas = document.createElement('canvas');
      canvas.width = targetW;
      canvas.height = targetH;
      const ctx = canvas.getContext('2d');

      const imgRatio = img.width / img.height;
      const targetRatio = targetW / targetH;
      let drawW, drawH, drawX, drawY;

      if (imgRatio > targetRatio) {
        drawH = img.height;
        drawW = img.height * targetRatio;
        drawX = (img.width - drawW) / 2;
        drawY = 0;
      } else {
        drawW = img.width;
        drawH = img.width / targetRatio;
        drawX = 0;
        drawY = (img.height - drawH) / 2;
      }

      ctx.drawImage(img, drawX, drawY, drawW, drawH, 0, 0, targetW, targetH);
      const url = canvas.toDataURL('image/png', 1.0);

      document.getElementById('uPhotoBox').style.backgroundImage = `url(${url})`;
      document.getElementById('uPh').style.display = 'none';

      const imgEl = document.getElementById('cPhotoImg');
      imgEl.src = url;
      imgEl.style.display = 'block';
      document.getElementById('cPh').style.display = 'none';
    };
    img.src = ev.target.result;
  };
  r.readAsDataURL(f);
}

function savePng() {
  html2canvas(document.getElementById('card'), {
    scale: 4,
    backgroundColor: null,
    useCORS: true,
    logging: false,
  }).then(c => {
    const a = document.createElement('a');
    const prefix = mode === 'temp' ? 'VISITOR_' : 'UNION_';
    a.download = prefix + (document.getElementById('inName').value || 'card') + '.png';
    a.href = c.toDataURL('image/png');
    a.click();
  });
}
