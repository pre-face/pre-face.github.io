<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Win98 Pure SMS Viewer</title>
    <style>
        /* === 시스템 기본 (바탕화면) === */
        body {
            background-color: #008080;
            font-family: 'Gulim', 'DungGeunMo', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            display: flex;
            gap: 20px;
            width: 95%;
            max-width: 1200px;
            height: 90vh;
        }

        /* === 윈도우 창 디자인 === */
        .win-window {
            background-color: #c0c0c0;
            border-top: 2px solid #dfdfdf;
            border-left: 2px solid #dfdfdf;
            border-right: 2px solid #000;
            border-bottom: 2px solid #000;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            padding: 3px;
            display: flex;
            flex-direction: column;
        }

        .title-bar {
            background: linear-gradient(90deg, #000080, #1084d0);
            padding: 3px 4px;
            color: white;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
            font-family: 'Gulim', sans-serif;
            letter-spacing: 0.5px;
        }

        .btn-close {
            background: #c0c0c0; width: 14px; height: 14px;
            text-align: center; line-height: 12px; font-size: 10px;
            border: 1px outset #fff; cursor: pointer; color: black; font-weight: bold;
        }

        .menu-bar { 
            margin: 0 2px 4px 2px; padding-bottom: 4px; border-bottom: 1px solid #808080; 
            font-size: 12px; color: #000; 
        }

        /* === 에디터 (왼쪽) === */
        .editor-panel { flex: 1; }
        textarea {
            flex: 1; margin: 2px; padding: 10px;
            border: 2px inset #dfdfdf; font-family: 'Gulim', monospace;
            resize: none; outline: none; line-height: 1.4; font-size: 12px;
            white-space: pre-wrap; overflow-y: scroll;
        }
        .controls { margin-top: 4px; display: flex; gap: 5px; justify-content: flex-end; align-items: center; }
        
        .win-btn {
            background: #c0c0c0; border: 2px outset #fff;
            padding: 4px 12px; font-family: 'Gulim', monospace; cursor: pointer; font-size: 12px;
        }
        .win-btn:active { border-style: inset; padding: 5px 11px 3px 13px; }

        /* === 미리보기 (오른쪽: 문자 뷰어) === */
        .preview-panel { flex: 1; max-width: 500px; }
        
        #sms-screen {
            flex: 1; 
            background: #ffffff; 
            border: 2px inset #dfdfdf;
            padding: 15px; 
            overflow-y: auto;
            display: flex; 
            flex-direction: column; 
            gap: 15px;
        }

        /* 말풍선 스타일 */
        .sms-row { display: flex; flex-direction: column; max-width: 85%; }
        
        .sms-meta {
            font-size: 11px; margin-bottom: 3px; font-family: 'Gulim';
            color: #666; display: flex; align-items: center; gap: 5px;
        }
        
        .sms-box {
            padding: 8px 10px;
            font-size: 12px; line-height: 1.4;
            border: 1px solid #000;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.2);
            word-break: break-all;
        }

        /* 받은 문자 (왼쪽) */
        .received { align-self: flex-start; }
        .received .sms-box { background: #fff; color: #000; }
        .received .sms-meta { justify-content: flex-start; }

        /* 보낸 문자 (오른쪽) */
        .sent { align-self: flex-end; }
        /* 미리보기 화면용 CSS */
        .sent .sms-meta { justify-content: flex-end; color: #000080; font-weight: bold; }
        .sent .sms-box { background: #000080; color: #fff; border-color: #000; }

        /* 스크롤바 */
        ::-webkit-scrollbar { width: 16px; background: #dfdfdf; }
        ::-webkit-scrollbar-thumb { background: #c0c0c0; border: 2px outset #fff; }
    </style>
</head>
<body>

<div class="container">
    <div class="win-window editor-panel">
        <div class="title-bar"><span>Input_Source.txt</span><div class="btn-close">×</div></div>
        <div class="menu-bar">File &nbsp; Edit &nbsp; Format</div>
        <textarea id="rawInput" placeholder="< 보낸사람 / 시간 / 받는사람 >&#10;[ 메시지 내용 ]&#10;&#10;예시:&#10;< A / 14:02 / B >&#10;[ 바보야? ]&#10;&#10;< B / 14:05 / A >&#10;[ 뭐? ]"></textarea>
        <div class="controls">
            <span style="font-size:12px;">내 이름:</span>
            <input type="text" id="myAlias" value="나" style="width:80px; font-family:'Gulim'; padding:2px; border:2px inset #dfdfdf;">
            <button class="win-btn" onclick="renderSMS()">변환 (Render)</button>
            <button class="win-btn" onclick="copyHTML()">HTML 복사</button>
        </div>
    </div>

    <div class="win-window preview-panel">
        <div class="title-bar">
            <div style="display:flex; align-items:center;">
                <span style="background:#fff; color:#000; padding:0 3px; margin-right:5px; font-size:10px; font-weight:bold; border-radius:1px;">S</span>
                <span id="winTitle">Message_Viewer.exe</span>
            </div>
            <div class="btn-close">×</div>
        </div>
        <div class="menu-bar">File &nbsp; View &nbsp; Help</div>
        
        <div id="sms-screen">
            <div style="text-align:center; margin-top:50%; color:#888; font-size:12px;">
                데이터를 입력하세요.
            </div>
        </div>
    </div>
</div>

<textarea id="copyBuffer" style="position:absolute; left:-9999px;"></textarea>

<script>
    let parsedData = [];
    let partnerName = "Unknown";

    function renderSMS() {
        const input = document.getElementById('rawInput').value;
        const myAlias = document.getElementById('myAlias').value.trim();
        const screen = document.getElementById('sms-screen');
        const titleSpan = document.getElementById('winTitle');
        
        const regex = /<\s*(.*?)\s*\/\s*(.*?)\s*\/\s*(.*?)\s*>\s*\[\s*([\s\S]*?)\s*\]/g;
        
        let match;
        let html = '';
        parsedData = []; 
        partnerName = "Unknown"; 

        while ((match = regex.exec(input)) !== null) {
            const sender = match[1].trim();
            const time = match[2].trim();
            const receiver = match[3].trim();
            let msg = match[4].trim().replace(/\n/g, '<br>');

            const isMe = (sender === myAlias);
            
            if (!isMe && partnerName === "Unknown") {
                partnerName = sender;
            } else if (isMe && partnerName === "Unknown" && receiver !== myAlias) {
                 partnerName = receiver;
            }

            parsedData.push({ isMe, sender, time, msg });

            // 이모지 제거됨
            if (isMe) {
                html += `
                <div class="sms-row sent">
                    <div class="sms-meta"><span>${time}</span></div>
                    <div class="sms-box">${msg}</div>
                </div>`;
            } else {
                html += `
                <div class="sms-row received">
                    <div class="sms-meta"><span>${sender}</span> <span style="font-size:10px; color:#888;">(${time})</span></div>
                    <div class="sms-box">${msg}</div>
                </div>`;
            }
        }

        if(partnerName !== "Unknown") {
            titleSpan.innerText = `${partnerName}.sms`;
        } else {
            titleSpan.innerText = `Message_Viewer.exe`;
        }

        if(html === '') {
            screen.innerHTML = '<div style="text-align:center; margin-top:50%; color:#888; font-size:12px;">[데이터 없음]</div>';
        } else {
            screen.innerHTML = html;
            screen.scrollTop = screen.scrollHeight;
        }
    }

    function copyHTML() {
        if(parsedData.length === 0) {
            alert("변환된 내용이 없습니다.");
            return;
        }

        let innerContent = "";

        parsedData.forEach(item => {
            // 이모지(✉️) 전부 제거 및 스타일 인라인화
            if (item.isMe) {
                // 나 (오른쪽, 파란색)
                innerContent += `
                <div style="display: flex; flex-direction: column; max-width: 85%; align-self: flex-end; margin-left: auto; margin-bottom: 15px;">
                    <div style="font-size: 11px; margin-bottom: 3px; font-family: 'Gulim', monospace; display: flex; align-items: center; justify-content: flex-end; color: #000080; font-weight: bold;">
                        <span>${item.time}</span>
                    </div>
                    <div style="padding: 8px 10px; font-size: 12px; line-height: 1.4; border: 1px solid #000; box-shadow: 2px 2px 0px rgba(0,0,0,0.2); word-break: break-all; background-color: #000080; color: #ffffff;">
                        ${item.msg}
                    </div>
                </div>`;
            } else {
                // 상대방 (왼쪽, 흰색)
                innerContent += `
                <div style="display: flex; flex-direction: column; max-width: 85%; align-self: flex-start; margin-right: auto; margin-bottom: 15px;">
                    <div style="font-size: 11px; margin-bottom: 3px; font-family: 'Gulim', monospace; display: flex; align-items: center; justify-content: flex-start; color: #444;">
                        <span>${item.sender}</span> <span style="font-size:10px; color:#888; margin-left:4px;">(${item.time})</span>
                    </div>
                    <div style="padding: 8px 10px; font-size: 12px; line-height: 1.4; border: 1px solid #000; box-shadow: 2px 2px 0px rgba(0,0,0,0.2); word-break: break-all; background-color: #ffffff; color: #000000;">
                        ${item.msg}
                    </div>
                </div>`;
            }
        });

        const fullHTML = `
<div style="max-width: 500px; margin: 20px auto; background-color: #c0c0c0; border-top: 2px solid #dfdfdf; border-left: 2px solid #dfdfdf; border-right: 2px solid #000000; border-bottom: 2px solid #000000; padding: 3px; font-family: '굴림', 'Gulim', monospace; box-shadow: 4px 4px 0px rgba(0,0,0,0.3);">
    <div style="background: linear-gradient(90deg, #000080, #1084d0); padding: 3px 4px; color: white; font-weight: bold; font-size: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; letter-spacing: 0.5px;">
        <div style="display:flex; align-items:center;">
            <span style="background:#fff; color:#000; padding:0 3px; margin-right:5px; font-size:10px; font-weight:bold; border-radius:1px; line-height:1;">S</span>
            <span>${partnerName !== "Unknown" ? partnerName + ".sms" : "Message_Viewer"}</span>
        </div>
        <div style="background: #c0c0c0; width: 14px; height: 14px; text-align: center; line-height: 12px; font-size: 10px; border: 1px outset #fff; cursor: default; color: black; font-weight: bold;">×</div>
    </div>
    <div style="margin: 0 2px 4px 2px; padding-bottom: 4px; border-bottom: 1px solid #808080; font-size: 12px; color: #000;">
        File &nbsp; View &nbsp; Help
    </div>
    <div style="background: #ffffff; border: 2px inset #dfdfdf; padding: 15px; display: flex; flex-direction: column; gap: 0;">
        ${innerContent}
    </div>
</div>
`;
        
        const buffer = document.getElementById('copyBuffer');
        buffer.value = fullHTML;
        buffer.select();
        document.execCommand('copy');
        alert('💾 문자 내역 복사 완료! (파란 배경 적용됨)');
    }
</script>

</body>
</html>
